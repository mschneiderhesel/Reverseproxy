user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;          # keine nginx-Version verraten

    # Gegen Slowloris & Co.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     65s;
    large_client_header_buffers 4 16k;

    # Docker-DNS: Upstreams per Containername werden zur Laufzeit aufgelöst,
    # nginx startet also auch, wenn ein Dienst gerade offline ist.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # WebSockets (Home Assistant, Node-RED, Zigbee2MQTT, ...)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- TLS (Mozilla "intermediate") -------------------------------------
    include /etc/nginx/runtime/cert.conf;   # Let's Encrypt oder Platzhalter, wird automatisch umgeschaltet
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;       # generiert aus SERVICES
    include /etc/nginx/custom/*.conf;       # eigene Sonderfälle (optional)
}
