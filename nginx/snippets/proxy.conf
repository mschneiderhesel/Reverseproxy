# Gemeinsame Proxy-Einstellungen für alle Dienste
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Bewusst NICHT $proxy_add_x_forwarded_for: wir sind der erste Hop und
# übernehmen keine vom Client gefälschten X-Forwarded-For-Header.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# lange Timeouts für WebSockets / Kamera-Streams
proxy_connect_timeout 10s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;
proxy_buffering       off;
proxy_request_buffering off;

# Upstreams mit selbstsigniertem HTTPS (z.B. Proxmox, UniFi) akzeptieren
proxy_ssl_server_name on;
proxy_ssl_verify      off;
